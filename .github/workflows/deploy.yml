# Mise en production sur le VPS à chaque fusion sur main (ou à la main depuis l'onglet Actions).
# Tests, puis zip de production, envoi par SSH et server/deploy-fedora.sh sur le VPS :
# sauvegardes, nouveaux fichiers (api/data intact), migration de la base, vérification, retour arrière si échec.
#
# À configurer une fois dans GitHub > Settings > Secrets and variables > Actions (voir server/LISEZ-MOI.txt) :
#   secrets   VPS_HOST, VPS_USER, VPS_SSH_KEY (clé privée), VPS_KNOWN_HOSTS (sortie de ssh-keyscan)
#   variables (facultatives) VPS_PORT (22), SITE_DIR (/var/www/html/speakeasy), SITE_URL (https://www.naulan-chrzaszcz.fr/speakeasy)
name: Mise en production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.SITE_URL || 'https://www.naulan-chrzaszcz.fr/speakeasy' }}/
    env:
      SITE_DIR: ${{ vars.SITE_DIR || '/var/www/html/speakeasy' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://www.naulan-chrzaszcz.fr/speakeasy' }}
      PORT: ${{ vars.VPS_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zip de production
        run: |
          npm install --no-audit --no-fund
          npm run zip
          unzip -l release/speakeasy-production.zip | grep -E 'api/data/(.*\.sqlite|config\.php|vapid\.json)' && { echo "Le zip contient des données serveur : refusé"; exit 1; } || true

      - name: Clé SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          test -n "$KEY" && test -n "$KNOWN" || { echo "Secrets VPS_SSH_KEY / VPS_KNOWN_HOSTS manquants"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts

      - name: Envoi et mise à jour sur le VPS
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          set -e
          SSH="ssh -i ~/.ssh/id_deploy -p $PORT -o StrictHostKeyChecking=yes -o BatchMode=yes"
          DEST="/tmp/speakeasy-deploy-${GITHUB_RUN_ID}"
          $SSH "$USER@$HOST" "mkdir -p $DEST"
          scp -i ~/.ssh/id_deploy -P "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
            release/speakeasy-production.zip server/deploy-fedora.sh "$USER@$HOST:$DEST/"
          SUDO=""; [ "$USER" = root ] || SUDO="sudo -n"
          $SSH "$USER@$HOST" "$SUDO env SITE_DIR='$SITE_DIR' bash $DEST/deploy-fedora.sh $DEST/speakeasy-production.zip; r=\$?; rm -rf $DEST; exit \$r"

      - name: Vérification publique
        run: |
          for i in 1 2 3 4 5; do
            r=$(curl -s --max-time 15 "$SITE_URL/api/account.php?a=ping" || true)
            echo "$r" | grep -q '"ok":true' && { echo "API : $r"; break; }
            [ $i = 5 ] && { echo "L'API publique ne répond pas : « $r »"; exit 1; }
            sleep 5
          done
          v=$(curl -s --max-time 15 "$SITE_URL/sw.js" | grep -o 'speakeasy-v[0-9]*-[0-9a-f]*' | head -1)
          echo "Version en ligne : $v"
